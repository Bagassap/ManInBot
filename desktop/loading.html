<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
<title>MiB</title>
<style>
  html, body { height: 100%; margin: 0; background: #020202; color: #e8eef0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; user-select: none; }
  img { width: 72px; height: 72px; animation: breathe 1.8s ease-in-out infinite; }
  p { margin: 0; color: #8a979c; }
  .bar { width: 160px; height: 3px; border-radius: 3px; background: #14191c; overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #2fc6b4; animation: slide 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .65; transform: scale(.96); } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
  <img src="build/icon.png" alt="">
  <div class="bar"></div>
  <p>Memuat MiB…</p>
</body>
</html>
