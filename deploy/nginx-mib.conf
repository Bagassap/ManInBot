
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/mib/site;
    index index.html;
    charset utf-8;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /download/info {
        alias /var/www/mib/downloads/info.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /download/install.ps1 {
        alias /var/www/mib/downloads/install.ps1;
        default_type text/plain;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/download/windows/(ringan|sedang|kuat)$ {
        return 301 /download/windows;
    }
    location = /download/windows {
        alias /var/www/mib/downloads/MiB-Setup.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="MiB-Setup.exe"';
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;

    location ~ /\. { deny all; }
}
