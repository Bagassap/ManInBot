# Situs promosi MiB: berkas statis hasil `next build` (ekspor statis) + unduhan installer.
# Tidak ada backend/database di server ini; layanan MiB sebenarnya berjalan di komputer pemakai.
# Diganti `__SERVER_NAME__` saat dipasang (lihat deploy/deploy.sh).

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/mib/site;
    index index.html;
    charset utf-8;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Unduhan (dibuat oleh deploy/build-site.cjs) ---
    location = /download/info {
        alias /var/www/mib/downloads/info.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /download/install.ps1 {
        alias /var/www/mib/downloads/install.ps1;
        default_type text/plain;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /download/windows {
        alias /var/www/mib/downloads/MiB-Setup.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="MiB-Setup.exe"';
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Aset Next: nama berkas ber-hash, aman di-cache lama ---
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Halaman: /fitur -> fitur.html, /docs/pengantar -> docs/pengantar.html ---
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;

    # Tidak menyajikan berkas tersembunyi
    location ~ /\. { deny all; }
}
